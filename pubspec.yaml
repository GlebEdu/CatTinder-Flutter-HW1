name: cattinder_hw1
description: "HW1 Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  flutter_bloc: ^8.1.3
  dartz: ^0.10.1
  get_it: ^7.2.0
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.2
  flutter_dotenv: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png 
    - .env